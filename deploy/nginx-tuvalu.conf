# /etc/nginx/sites-available/tuvalu  (subdomain of shelfcompass.com)
# Issue a certificate first, e.g.:  certbot --nginx -d tuvalu.shelfcompass.com
server {
    listen 80;
    listen [::]:80;
    server_name tuvalu.shelfcompass.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tuvalu.shelfcompass.com;

    ssl_certificate     /etc/letsencrypt/live/tuvalu.shelfcompass.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tuvalu.shelfcompass.com/privkey.pem;

    client_max_body_size 52m;            # largest upload (import package) + headroom
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;     # the app compares Origin with Host (CSRF defence)
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append client-supplied values
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering off;
        # Private pages: never cached by the proxy.
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
}
