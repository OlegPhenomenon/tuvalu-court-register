# docker compose up -d   → http://127.0.0.1:8088
# Data (database + private files) lives in the named volume and survives restarts/upgrades.
services:
  court:
    build: .
    image: tuvalu-court:0.1.0
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8088:8088"   # loopback only; put the reverse proxy (TLS) in front
    volumes:
      - court-data:/data
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    cpus: 0.5

volumes:
  court-data:
